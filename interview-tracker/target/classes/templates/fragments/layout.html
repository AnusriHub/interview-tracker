<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' — ' : ''} + 'Interview Tracker'">Interview Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<th:block th:fragment="layout(content, pageTitle, activePage)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' — Interview Tracker'">Interview Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<nav class="navbar">
    <a th:href="@{/}" class="nav-brand">
        <span class="nav-logo">⚡</span>
        <span class="nav-title">Interview Tracker</span>
    </a>
    <div class="nav-links">
        <a th:href="@{/}" th:class="${activePage == 'dashboard'} ? 'nav-link active' : 'nav-link'">Dashboard</a>
        <a th:href="@{/applications}" th:class="${activePage == 'applications'} ? 'nav-link active' : 'nav-link'">Applications</a>
        <a th:href="@{/applications/new}" class="btn-nav-new">+ Add New</a>
    </div>
</nav>

<main class="main-content">
    <div th:if="${successMessage}" class="alert alert-success">
        <span>✓</span>
        <span th:text="${successMessage}"></span>
        <button onclick="this.parentElement.remove()" class="alert-close">×</button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-error">
        <span>!</span>
        <span th:text="${errorMessage}"></span>
        <button onclick="this.parentElement.remove()" class="alert-close">×</button>
    </div>
    <th:block th:replace="${content}"/>
</main>

<script th:src="@{/js/main.js}"></script>
</body>
</th:block>
</body>
</html>
